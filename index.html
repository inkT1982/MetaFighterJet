<!DOCTYPE html>
<html lang="en">
<head><style>

</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React Artifact</title>
  <style>*,:after,:before{--tw-border-spacing-x:0;--tw-border-spacing-y:0;--tw-translate-x:0;--tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;--tw-scale-x:1;--tw-scale-y:1;--tw-pan-x: ;--tw-pan-y: ;--tw-pinch-zoom: ;--tw-scroll-snap-strictness:proximity;--tw-ordinal: ;--tw-slashed-zero: ;--tw-numeric-figure: ;--tw-numeric-spacing: ;--tw-numeric-fraction: ;--tw-ring-inset: ;--tw-ring-offset-width:0px;--tw-ring-offset-color:#fff;--tw-ring-color:rgb(59 130 246 / 0.5);--tw-ring-offset-shadow:0 0 #0000;--tw-ring-shadow:0 0 #0000;--tw-shadow:0 0 #0000;--tw-shadow-colored:0 0 #0000;--tw-blur: ;--tw-brightness: ;--tw-contrast: ;--tw-grayscale: ;--tw-hue-rotate: ;--tw-invert: ;--tw-saturate: ;--tw-sepia: ;--tw-drop-shadow: ;--tw-backdrop-blur: ;--tw-backdrop-brightness: ;--tw-backdrop-contrast: ;--tw-backdrop-grayscale: ;--tw-backdrop-hue-rotate: ;--tw-backdrop-invert: ;--tw-backdrop-saturate: ;--tw-backdrop-sepia: }::backdrop{--tw-border-spacing-x:0;--tw-border-spacing-y:0;--tw-translate-x:0;--tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;--tw-scale-x:1;--tw-scale-y:1;--tw-pan-x: ;--tw-pan-y: ;--tw-pinch-zoom: ;--tw-scroll-snap-strictness:proximity;--tw-ordinal: ;--tw-slashed-zero: ;--tw-numeric-figure: ;--tw-numeric-spacing: ;--tw-numeric-fraction: ;--tw-ring-inset: ;--tw-ring-offset-width:0px;--tw-ring-offset-color:#fff;--tw-ring-color:rgb(59 130 246 / 0.5);--tw-ring-offset-shadow:0 0 #0000;--tw-ring-shadow:0 0 #0000;--tw-shadow:0 0 #0000;--tw-shadow-colored:0 0 #0000;--tw-blur: ;--tw-brightness: ;--tw-contrast: ;--tw-grayscale: ;--tw-hue-rotate: ;--tw-invert: ;--tw-saturate: ;--tw-sepia: ;--tw-drop-shadow: ;--tw-backdrop-blur: ;--tw-backdrop-brightness: ;--tw-backdrop-contrast: ;--tw-backdrop-grayscale: ;--tw-backdrop-hue-rotate: ;--tw-backdrop-invert: ;--tw-backdrop-saturate: ;--tw-backdrop-sepia: }</style>
</head>
<body>
  <div id="root"></div>
  
  <script type="module">
    import React from 'https://cdn.jsdelivr.net/npm/react@18.2.0/+esm';
    import ReactDOM from 'https://cdn.jsdelivr.net/npm/react-dom@18.2.0/+esm';

    function GameComponent() {
      const canvasRef = React.useRef(null);
      const gameStateRef = React.useRef({
        bullets: [],
        enemies: [],
        playerX: 0.5,
        playerY: 0.9,
        score: 0
      });

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const gl = canvas.getContext('webgl2');
        if (!gl) return;

        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          gl.viewport(0, 0, canvas.width, canvas.height);
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Enhanced vertex shader
        const vertexShader = `
          attribute vec2 a_position;
          void main(){ 
            gl_Position = vec4(a_position, 0., 1.); 
          }
        `;

        // Enhanced fragment shader with rotating globe and clouds
        const fragmentShader = `
          precision highp float;
          uniform vec2 u_resolution;
          uniform float u_time;
          
          float hash(vec2 p){ 
            return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); 
          }
          
          float noise(vec2 p){
            vec2 i = floor(p);
            vec2 f = fract(p);
            float a = hash(i);
            float b = hash(i+vec2(1.,0.));
            float c = hash(i+vec2(0.,1.));
            float d = hash(i+vec2(1.,1.));
            vec2 u = f*f*(3.-2.*f);
            return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
          }
          
          float fbm(vec2 p){
            float v=0.;
            float a=0.5;
            for(int i=0;i<4;i++){
              v+= a*noise(p);
              p*=2.13;
              a*=0.52;
            }
            return v;
          }
          
          void main(){
            vec2 frag = gl_FragCoord.xy;
            vec2 uv = frag / u_resolution;
            float aspect = u_resolution.x / u_resolution.y;
            vec2 p = vec2(uv.x*aspect, uv.y);
            vec2 earthCenter = vec2(aspect*0.5, -0.58);
            float R = 1.22;
            float d = length(p - earthCenter);

            vec3 colTop = vec3(0.059,0.09,0.165);
            vec3 colMid1 = vec3(0.118,0.161,0.231);
            vec3 colMid2 = vec3(0.278,0.333,0.416);
            vec3 colHorizon1 = vec3(0.49,0.827,0.988);
            vec3 colHorizon2 = vec3(0.88,0.95,1.0);
            float t = uv.y;
            vec3 skyCol;
            if(t>0.68) skyCol = mix(colMid1, colTop, smoothstep(0.68,1.0,t));
            else if(t>0.52) skyCol = mix(colMid2, colMid1, smoothstep(0.52,0.68,t));
            else if(t>0.38) skyCol = mix(colHorizon1, colMid2, smoothstep(0.38,0.52,t));
            else skyCol = mix(colHorizon2, colHorizon1, smoothstep(0.12,0.38,t));

            vec2 aurPos1 = vec2(aspect*0.22, 0.92);
            float aur1 = exp(-length(p - vec2(aurPos1.x, aurPos1.y))*2.2)*0.18;
            skyCol += vec3(0.13,0.77,0.37)*aur1;
            vec2 aurPos2 = vec2(aspect*0.78, 0.88);
            float aur2 = exp(-length(p - vec2(aurPos2.x, aurPos2.y))*2.5)*0.14;
            skyCol += vec3(0.98,0.75,0.14)*aur2*0.6 + vec3(0.49,0.827,0.988)*aur2*0.6;

            vec3 finalCol = skyCol;

            if(d > R+0.13){
              float drift = u_time*0.008;
              vec2 starUV = vec2(p.x + drift, p.y);
              vec2 grid = starUV * vec2(80., 80.);
              vec2 id = floor(grid);
              vec2 gv = fract(grid)-0.5;
              float h = hash(id);
              if(h>0.985){
                float size = fract(h*437.)*0.6+0.2;
                float distStar = length(gv);
                float star = smoothstep(0.5,0.0,distStar/(size*0.6));
                float tw = 0.7 + 0.3*sin(u_time*2.5 + h*6.28);
                finalCol += vec3(1.)*star*tw*0.9* (h*0.5+0.5);
              }
              vec2 grid2 = starUV * vec2(150., 150.);
              vec2 id2 = floor(grid2);
              vec2 gv2 = fract(grid2)-0.5;
              float h2 = hash(id2+10.);
              if(h2>0.992){
                float star2 = smoothstep(0.5,0.0,length(gv2)/0.4);
                float tw2 = 0.6 + 0.4*sin(u_time*3.1 + h2*7.);
                finalCol += vec3(0.9,0.95,1.)*star2*tw2*0.6;
              }
            }

            vec2 moonPos = vec2(aspect*0.84, 0.86);
            float moonR = 0.042;
            float md = length(p - moonPos);
            if(md < moonR){
              vec3 moonBase = vec3(0.85,0.86,0.88);
              float shade = 0.6 + 0.4* ((p.x - moonPos.x)/moonR *0.5 + 0.5);
              vec3 mc = moonBase*shade;
              float cr = noise((p-moonPos)*120.)*0.12;
              mc -= cr;
              finalCol = mix(finalCol, mc, smoothstep(moonR, moonR*0.85, md));
              finalCol += vec3(0.9,0.92,1.)*0.04*exp(-md*30.);
            }
            
            vec2 marsPos = vec2(aspect*0.17, 0.79);
            float marsR = 0.028;
            float marsD = length(p - marsPos);
            if(marsD < marsR){
              vec3 marsBase = vec3(0.78,0.38,0.26);
              float shadeM = 0.65 + 0.35*clamp((p.x - marsPos.x)/marsR*0.6+0.5,0.,1.);
              vec3 marsC = marsBase*shadeM;
              finalCol = mix(finalCol, marsC, smoothstep(marsR, marsR*0.8, marsD));
              finalCol += vec3(1.,0.6,0.4)*0.06*exp(-marsD*40.);
            }

            if(d < R){
              vec3 ocean = vec3(0.039,0.118,0.227);
              float z = sqrt(max(0., R*R - d*d));
              vec3 N = normalize(vec3((p.x - earthCenter.x)/R, (p.y - earthCenter.y)/R, z/R));
              vec3 sunDir = normalize(vec3(0.62, 0.34, 0.42));
              float NdotL = max(0., dot(N, sunDir));
              float NdotV = N.z;
              float lon = atan(N.y, N.x);
              float lat = asin(clamp(N.z*0.2 + N.y*0.8, -1.,1.));
              
              // Add rotation to globe
              lon += u_time * 0.3;
              
              vec2 contUV = vec2(lon*1.2, lat*2.5);
              float contNoise = fbm(contUV*2.5 + vec2(0.5,1.2));
              float landMask = smoothstep(0.48,0.62, contNoise);
              float blob = sin(contUV.x*2.1 + contUV.y*1.3)*0.5 + cos(contUV.x*3.7 - contUV.y*2.2)*0.5;
              landMask = mix(landMask, smoothstep(0.1,0.5,blob),0.35);
              
              vec3 land = vec3(0.028,0.086,0.184);
              vec3 base = mix(ocean, land, landMask*0.85);
              vec3 lit = base * (0.22 + 0.85*NdotL);
              float terminator = smoothstep(0.,0.25,NdotL);
              lit = mix(base*0.18, lit, terminator);
              
              if(NdotL < 0.35){
                float cityPattern = noise(contUV*18.);
                float cityHash = hash(floor(contUV*60.));
                float city = step(0.68,cityPattern)* landMask * (1.-terminator);
                city *= step(0.7, cityHash);
                lit += vec3(1.,0.76,0.28)*city*0.22 * (1.-NdotL);
              }
              
              // Add clouds
              float cloudPattern = fbm(contUV*3.5 + vec2(u_time*0.15, 0.0));
              float clouds = smoothstep(0.4, 0.7, cloudPattern) * 0.5;
              lit += vec3(1.0, 1.0, 1.0) * clouds * 0.4;
              
              float rim = pow(1.-max(0., NdotV), 3.5);
              vec3 rimCol = vec3(0.49,0.827,0.988);
              lit += rimCol * rim * 0.55 * (0.4+0.6*NdotL);
              if(d > R*0.88){
                float haze = smoothstep(R*0.88, R, d);
                lit = mix(lit, vec3(0.7,0.85,0.96), haze*0.18);
              }
              finalCol = lit + rimCol*rim*0.45;
            } else {
              float atmWidth = 0.095;
              if(d < R + atmWidth){
                float atmT = 1.- smoothstep(R, R+atmWidth, d);
                vec2 dirToCenter = normalize(p - earthCenter);
                float sunInfluence = dot(dirToCenter, vec2(0.55,0.8))*0.5+0.5;
                float atmIntensity = atmT*atmT* (0.6 + 0.4*sunInfluence);
                vec3 atmCol = vec3(0.49,0.827,0.988);
                vec3 atmCol2 = vec3(0.22,0.55,0.95);
                vec3 atmFinal = mix(atmCol2, atmCol, atmT);
                finalCol += atmFinal * atmIntensity * 1.25;
                finalCol += atmFinal * pow(atmT,2.)*0.7;
              }
            }
            float vig = 1.- dot(uv-0.5, uv-0.5)*0.32;
            finalCol *= vig;
            gl_FragColor = vec4(finalCol,1.);
          }
        `;

        function compileShader(shaderSource, shaderType) {
          const shader = gl.createShader(shaderType);
          gl.shaderSource(shader, shaderSource);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            console.error(gl.getShaderInfoLog(shader));
          }
          return shader;
        }

        const vertexShaderObj = compileShader(vertexShader, gl.VERTEX_SHADER);
        const fragmentShaderObj = compileShader(fragmentShader, gl.FRAGMENT_SHADER);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShaderObj);
        gl.attachShader(program, fragmentShaderObj);
        gl.linkProgram(program);

        const positionLoc = gl.getAttribLocation(program, 'a_position');
        const timeUni = gl.getUniformLocation(program, 'u_time');
        const resUni = gl.getUniformLocation(program, 'u_resolution');

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

        const render = (time) => {
          gl.useProgram(program);
          gl.enableVertexAttribArray(positionLoc);
          gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
          gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);
          gl.uniform1f(timeUni, time * 0.001);
          gl.uniform2f(resUni, canvas.width, canvas.height);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          requestAnimationFrame(render);
        };
        
        render(0);

        return () => {
          window.removeEventListener('resize', resizeCanvas);
        };
      }, []);

      return React.createElement('canvas', {
        ref: canvasRef,
        style: { display: 'block', width: '100%', height: '100vh' }
      });
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(GameComponent)
    );
  </script>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #root {
      width: 100%;
      height: 100%;
    }
  </style>
</body>
