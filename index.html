<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaFighterJet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #0a162a;
      font-family: 'Inter', system-ui, sans-serif;
    }
    
    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    canvas {
      display: block;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ffff;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0,255,255,0.5);
      z-index: 10;
    }
    
    #score {
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    #health {
      font-size: 18px;
      color: #ff4444;
      text-shadow: 0 0 10px rgba(255,68,68,0.5);
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
      <div id="score">Score: 0</div>
      <div id="health">Health: 100</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const healthEl = document.getElementById('health');
    
    canvas.width = Math.min(window.innerWidth, 800);
    canvas.height = window.innerHeight;
    
    // Game state
    const game = {
      score: 0,
      health: 100,
      time: 0,
      paused: false
    };
    
    // Player
    const player = {
      x: canvas.width / 2,
      y: canvas.height - 50,
      width: 30,
      height: 40,
      speed: 5,
      fireRate: 8,
      fireCounter: 0,
      keys: {}
    };
    
    // Arrays for game objects
    const bullets = [];
    const enemies = [];
    const explosions = [];
    
    // Input handling
    window.addEventListener('keydown', (e) => {
      player.keys[e.key] = true;
      if (e.key === ' ') {
        e.preventDefault();
        playerShoot();
      }
    });
    
    window.addEventListener('keyup', (e) => {
      player.keys[e.key] = false;
    });
    
    // Mouse handling
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      player.x = e.clientX - rect.left;
    });
    
    // Player shooting
    function playerShoot() {
      bullets.push({
        x: player.x,
        y: player.y - 10,
        vx: 0,
        vy: -8,
        width: 4,
        height: 12,
        life: 500,
        maxLife: 500
      });
    }
    
    // Spawn enemies
    function spawnEnemy() {
      const enemyTypes = ['fighter', 'drone'];
      const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
      
      enemies.push({
        x: Math.random() * (canvas.width - 30),
        y: -40,
        vx: (Math.random() - 0.5) * 3,
        vy: 2 + Math.random() * 1.5,
        width: type === 'fighter' ? 30 : 20,
        height: type === 'fighter' ? 30 : 20,
        health: type === 'fighter' ? 3 : 1,
        maxHealth: type === 'fighter' ? 3 : 1,
        type: type,
        fireCounter: 0,
        fireRate: type === 'fighter' ? 40 : 80
      });
    }
    
    // Create explosion
    function createExplosion(x, y, size = 20) {
      explosions.push({
        x: x,
        y: y,
        size: size,
        maxSize: size,
        life: 30,
        particles: []
      });
      
      // Particle effect
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        explosions[explosions.length - 1].particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * 3,
          vy: Math.sin(angle) * 3,
          life: 30
        });
      }
    }
    
    // Update player
    function updatePlayer() {
      if (player.keys['ArrowLeft'] || player.keys['a']) {
        player.x -= player.speed;
      }
      if (player.keys['ArrowRight'] || player.keys['d']) {
        player.x += player.speed;
      }
      
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      
      player.fireCounter--;
      if (player.fireCounter < 0 && player.keys[' ']) {
        playerShoot();
        player.fireCounter = player.fireRate;
      }
    }
    
    // Update bullets
    function updateBullets() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        bullet.x += bullet.vx;
        bullet.y += bullet.vy;
        bullet.life--;
        
        // Remove if off screen or dead
        if (bullet.y < 0 || bullet.life <= 0) {
          bullets.splice(i, 1);
        }
      }
    }
    
    // Update enemies
    function updateEnemies() {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        enemy.x += enemy.vx;
        enemy.y += enemy.vy;
        enemy.fireCounter++;
        
        // Remove if off screen
        if (enemy.y > canvas.height) {
          enemies.splice(i, 1);
          game.health -= 10;
          game.health = Math.max(0, game.health);
          continue;
        }
        
        // Enemy shoots randomly
        if (enemy.fireCounter > enemy.fireRate) {
          bullets.push({
            x: enemy.x,
            y: enemy.y + enemy.height,
            vx: (Math.random() - 0.5) * 2,
            vy: 4,
            width: 3,
            height: 10,
            life: 500,
            maxLife: 500,
            isEnemyBullet: true
          });
          enemy.fireCounter = 0;
        }
      }
    }
    
    // Collision detection
    function checkCollisions() {
      // Player bullet vs enemies
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        if (bullet.isEnemyBullet) continue;
        
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          
          if (bullet.x < enemy.x + enemy.width &&
              bullet.x + bullet.width > enemy.x &&
              bullet.y < enemy.y + enemy.height &&
              bullet.y + bullet.height > enemy.y) {
            
            enemy.health--;
            bullets.splice(i, 1);
            
            if (enemy.health <= 0) {
              game.score += enemy.type === 'fighter' ? 100 : 50;
              createExplosion(enemy.x, enemy.y, 25);
              enemies.splice(j, 1);
            }
            break;
          }
        }
      }
      
      // Enemy bullets vs player
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        if (!bullet.isEnemyBullet) continue;
        
        if (bullet.x < player.x + player.width &&
            bullet.x + bullet.width > player.x &&
            bullet.y < player.y + player.height &&
            bullet.y + bullet.height > player.y) {
          
          game.health -= 5;
          game.health = Math.max(0, game.health);
          bullets.splice(i, 1);
          createExplosion(player.x, player.y, 15);
        }
      }
    }
    
    // Draw background with rotating globe
    function drawBackground() {
      // Sky gradient
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#0a162a');
      gradient.addColorStop(0.5, '#1a3a52');
      gradient.addColorStop(1, '#2a5a8a');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw rotating earth
      const earthX = canvas.width / 2;
      const earthY = canvas.height / 2 + 150;
      const earthRadius = 120;
      
      // Earth glow
      ctx.fillStyle = 'rgba(0, 150, 255, 0.15)';
      ctx.beginPath();
      ctx.arc(earthX, earthY, earthRadius + 20, 0, Math.PI * 2);
      ctx.fill();
      
      // Earth sphere
      ctx.fillStyle = '#1a4a7a';
      ctx.beginPath();
      ctx.arc(earthX, earthY, earthRadius, 0, Math.PI * 2);
      ctx.fill();
      
      // Rotating clouds and continents
      ctx.save();
      ctx.translate(earthX, earthY);
      ctx.rotate(game.time * 0.0005);
      
      // Cloud patterns
      ctx.fillStyle = 'rgba(200, 220, 240, 0.3)';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(Math.cos(i) * 80, Math.sin(i * 1.5) * 80, 25, 0, Math.PI * 2);
        ctx.fill();
      }
      
      // Continents
      ctx.fillStyle = '#2a6a3a';
      ctx.beginPath();
      ctx.ellipse(40, -30, 35, 45, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(-50, 20, 30, 40, -0.2, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
      
      // Earth outline
      ctx.strokeStyle = 'rgba(0, 150, 255, 0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(earthX, earthY, earthRadius, 0, Math.PI * 2);
      ctx.stroke();
    }
    
    // Draw player
    function drawPlayer() {
      // Player body
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = 'rgba(0, 255, 255, 0.8)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(player.x - player.width / 2, player.y + player.height);
      ctx.lineTo(player.x, player.y + player.height - 10);
      ctx.lineTo(player.x + player.width / 2, player.y + player.height);
      ctx.closePath();
      ctx.fill();
      
      // Cockpit
      ctx.fillStyle = '#ffff00';
      ctx.fillRect(player.x - 4, player.y + 5, 8, 8);
      ctx.shadowBlur = 0;
    }
    
    // Draw bullets
    function drawBullets() {
      for (const bullet of bullets) {
        if (bullet.isEnemyBullet) {
          ctx.fillStyle = '#ff4444';
          ctx.shadowColor = 'rgba(255, 68, 68, 0.8)';
        } else {
          // Bright yellow/cyan bullets
          ctx.fillStyle = '#ffff00';
          ctx.shadowColor = 'rgba(255, 255, 0, 0.9)';
        }
        ctx.shadowBlur = 8;
        ctx.fillRect(bullet.x - bullet.width / 2, bullet.y, bullet.width, bullet.height);
      }
      ctx.shadowBlur = 0;
    }
    
    // Draw enemies
    function drawEnemies() {
      for (const enemy of enemies) {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        
        if (enemy.type === 'fighter') {
          // Fighter jet - brighter colors
          ctx.fillStyle = '#ff8800';
          ctx.shadowColor = 'rgba(255, 136, 0, 0.8)';
          ctx.shadowBlur = 8;
          
          // Fuselage
          ctx.beginPath();
          ctx.moveTo(0, -15);
          ctx.lineTo(-10, 15);
          ctx.lineTo(0, 10);
          ctx.lineTo(10, 15);
          ctx.closePath();
          ctx.fill();
          
          // Cockpit highlight
          ctx.fillStyle = '#ffff44';
          ctx.fillRect(-2, -5, 4, 6);
        } else {
          // Drone - lighter, brighter
          ctx.fillStyle = '#ff6600';
          ctx.shadowColor = 'rgba(255, 102, 0, 0.8)';
          ctx.shadowBlur = 8;
          
          ctx.beginPath();
          ctx.arc(0, 0, 10, 0, Math.PI * 2);
          ctx.fill();
          
          // Drone propellers
          ctx.strokeStyle = '#ffaa44';
          ctx.lineWidth = 2;
          for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(Math.cos(i * Math.PI / 2) * 12, Math.sin(i * Math.PI / 2) * 12);
            ctx.lineTo(Math.cos(i * Math.PI / 2) * 16, Math.sin(i * Math.PI / 2) * 16);
            ctx.stroke();
          }
        }
        
        // Health bar
        ctx.fillStyle = '#ff4444';
        ctx.fillRect(-enemy.width / 2, -20, enemy.width, 3);
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(-enemy.width / 2, -20, (enemy.health / enemy.maxHealth) * enemy.width, 3);
        
        ctx.restore();
      }
    }
    
    // Draw explosions
    function drawExplosions() {
      for (let i = explosions.length - 1; i >= 0; i--) {
        const exp = explosions[i];
        
        // Main burst
        ctx.fillStyle = `rgba(255, 200, 0, ${exp.life / exp.maxSize * 0.8})`;
        ctx.shadowColor = 'rgba(255, 150, 0, 0.9)';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(exp.x, exp.y, (exp.maxSize * (1 - exp.life / exp.maxSize)) * 0.7, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = `rgba(255, 100, 0, ${exp.life / exp.maxSize * 0.6})`;
        ctx.beginPath();
        ctx.arc(exp.x, exp.y, (exp.maxSize * (1 - exp.life / exp.maxSize)) * 0.9, 0, Math.PI * 2);
        ctx.fill();
        
        // Particles
        for (const particle of exp.particles) {
          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.life--;
          
          ctx.fillStyle = `rgba(255, 200, 0, ${particle.life / 30})`;
          ctx.fillRect(particle.x - 2, particle.y - 2, 4, 4);
        }
        
        exp.life--;
        if (exp.life <= 0) {
          explosions.splice(i, 1);
        }
      }
      ctx.shadowBlur = 0;
    }
    
    // Main game loop
    let spawnCounter = 0;
    function gameLoop() {
      game.time++;
      
      // Spawn enemies
      spawnCounter++;
      if (spawnCounter > Math.max(20, 120 - game.score / 20)) {
        spawnEnemy();
        spawnCounter = 0;
      }
      
      // Update
      updatePlayer();
      updateBullets();
      updateEnemies();
      checkCollisions();
      
      // Draw
      drawBackground();
      drawBullets();
      drawEnemies();
      drawPlayer();
      drawExplosions();
      
      // Update UI
      scoreEl.textContent = `Score: ${game.score}`;
      healthEl.textContent = `Health: ${game.health}`;
      
      // Game over
      if (game.health <= 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 48px Inter';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(255, 68, 68, 0.8)';
        ctx.shadowBlur = 10;
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.font = '24px Inter';
        ctx.fillText(`Final Score: ${game.score}`, canvas.width / 2, canvas.height / 2 + 50);
        ctx.fillText('Refresh to play again', canvas.width / 2, canvas.height / 2 + 100);
        return;
      }
      
      requestAnimationFrame(gameLoop);
    }
    
    // Start game
    gameLoop();
    
    // Handle window resize
    window.addEventListener('resize', () => {
      canvas.width = Math.min(window.innerWidth, 800);
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
